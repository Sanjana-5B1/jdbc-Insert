<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BVRI E-Commerce</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Header */
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .welcome-text {
            font-size: 14px;
            font-weight: bold;
        }

        .title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            font-weight: bold;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background-color: #005a9e;
            height: calc(100vh - 110px);
            position: fixed;
            top: 60px;
            left: 0;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        .sidebar a:hover {
            background-color: #003f6f;
        }

        /* Main content */
        .content {
            margin-left: 220px;
            padding: 40px;
        }

        /* Registration card */
        .card {
            background-color: #00e5ff;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 5px;
        }

        .card h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .row div {
            flex: 1;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 3px;
        }

        .gender {
            margin-top: 10px;
        }

        .gender label {
            font-weight: normal;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .submit-btn:hover {
            background-color: #0b7dda;
        }

        .link {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        /* Footer */
        .footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <span class="welcome-text">Welcome 24WH1A05B1 SANJANA</span>
        <span class="title">BVRI E-COMMERCE</span>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="#">REGISTRATION</a>
        <a href="#">LOGIN</a>
        <a href="#">CATALOG</a>
        <a href="#">CART</a>
        <a href="#">LOGOUT</a>
    </div>

    <!-- Main Content -->
    <div class="content">
        <div class="card">
            <h2>Create Account</h2>

            <div class="row">
                <div>
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name">
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" placeholder="Enter a password">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email">
                </div>
                <div>
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm your password">
                </div>
            </div>

            <label>Gender</label>
            <div class="gender">
                <input type="radio" name="gender"> Male<br>
                <input type="radio" name="gender"> Female<br>
                <input type="radio" name="gender"> Other
            </div>

            <button class="submit-btn">Submit</button>

            <div class="link">
                Explore our Product Catalog
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        © 2024 BVRI. All rights reserved.<br>
        Contact us: info@bvrit.com
    </div>

</body>
</html>
